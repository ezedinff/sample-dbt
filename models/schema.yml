version: 2

models:
  - name: stg_cart_events
    description: >
      INTENTIONAL BREAK for cart_rename_broken — selects event_type while
      source documents event_name. Bounded fix target.
    columns:
      - name: cart_id
      - name: event_type
        description: Stale identifier; should be event_name after fix.
      - name: market

  - name: stg_orders
    description: Staging for RAW_ORDERS (shared order header schema).

  - name: stg_vehicle
    description: Staging for RAW_VEHICLE (may contain duplicate vins).

  - name: stg_exchange_rates
    description: Staging for FX rates.

  - name: stg_order_lines
    description: Staging for order line items.

  - name: int_abandoned_cart
    description: Cart created/abandoned grain for rate metric.
    columns:
      - name: cart_id
      - name: is_abandoned

  - name: int_orders_enriched
    description: >
      INTENTIONAL BREAK for join_explosion — joins vehicle without dedupe.

  - name: int_orders_vehicle_cast
    description: >
      INTENTIONAL BREAK for cast_join_miss — vin equality without LPAD.

  - name: mart_abandoned_cart_rate
    description: Abandoned cart rate by market (cart_se_drop endpoint).

  - name: mart_orders_enriched
    description: Publishes join-explosion enrichment.

  - name: mart_orders_enriched_cast
    description: Publishes cast-join enrichment miss.

  - name: mart_order_freshness
    description: Freshness snapshot from loaded_at.

  - name: mart_order_vehicle_match
    description: Completeness counts for unmatched VINs.

  - name: mart_revenue_usd
    description: Order amounts converted via FX (fx_rate_gap).

  - name: mart_cart_created
    description: >
      INTENTIONAL BREAK for filter_overreach — WHERE market = 'DE'.

  - name: mart_order_revenue
    description: >
      INTENTIONAL BREAK for wrong_grain_mart — line grain as order_revenue.
