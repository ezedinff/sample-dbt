version: 2

sources:
  - name: raw
    description: >
      RAW schema in LIGHTHOUSE_DEV. Seeded by
      tenant-context/example/scripts/load_scenarios.py.
    schema: RAW
    database: LIGHTHOUSE_DEV
    tables:
      - name: RAW_EVENTS_CART
        description: >
          Cart event stream. Current upstream contract uses event_name
          (not event_type). Staging intentionally still reads event_type
          for the cart_rename_broken remediation case.
        columns:
          - name: session_id
          - name: cart_id
          - name: user_id
          - name: event_timestamp
          - name: event_name
          - name: currency_code
          - name: cart_value
          - name: market

      - name: RAW_ORDERS
        description: Order header rows (freshness, join, completeness, cast scenarios).
        columns:
          - name: order_id
          - name: vin
          - name: market
          - name: ordered_at
          - name: order_value
          - name: loaded_at
          - name: currency_code
          - name: amount
          - name: order_date

      - name: RAW_VEHICLE
        description: Vehicle dimension; may contain duplicate vins (join_explosion).
        columns:
          - name: vehicle_id
          - name: vin
          - name: model_name
          - name: updated_at

      - name: RAW_EXCHANGE_RATES
        description: FX rates by currency and valid_on date (fx_rate_gap).
        columns:
          - name: currency_code
          - name: rate_to_usd
          - name: valid_on

      - name: RAW_ORDER_LINES
        description: Order line items for grain tests (wrong_grain_mart).
        columns:
          - name: order_id
          - name: line_number
          - name: line_value
          - name: market
          - name: order_date
