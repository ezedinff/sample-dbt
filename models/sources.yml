version: 2

sources:
  - name: raw
    description: RAW schema in LIGHTHOUSE_DEV.
    schema: RAW
    database: LIGHTHOUSE_DEV
    tables:
      - name: RAW_EVENTS_CART
        description: Cart event stream.
        columns:
          - name: session_id
          - name: cart_id
          - name: user_id
          - name: event_timestamp
          - name: event_name
          - name: currency_code
          - name: cart_value
          - name: market

      - name: RAW_ORDERS
        description: Order header rows.
        columns:
          - name: order_id
          - name: vin
          - name: market
          - name: ordered_at
          - name: order_value
          - name: loaded_at
          - name: currency_code
          - name: amount
          - name: order_date

      - name: RAW_VEHICLE
        description: Vehicle dimension.
        columns:
          - name: vehicle_id
          - name: vin
          - name: model_name
          - name: updated_at

      - name: RAW_EXCHANGE_RATES
        description: FX rates by currency and valid_on date.
        columns:
          - name: currency_code
          - name: rate_to_usd
          - name: valid_on

      - name: RAW_ORDER_LINES
        description: Order line items.
        columns:
          - name: order_id
          - name: line_number
          - name: line_value
          - name: market
          - name: order_date
