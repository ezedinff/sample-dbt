version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: raw_events_cart
        description: >
          Current raw cart-event source contract. This upstream source now exposes
          event_name for the event classification field; the staging model is
          intentionally still reading the old event_type field for Lighthouse
          remediation testing.
        columns:
          - name: session_id
          - name: cart_id
          - name: user_id
          - name: event_timestamp
          - name: event_name
          - name: currency_code
          - name: cart_value
          - name: market
      - name: raw_events_cart_broken
        description: Legacy fixture table retained for manual scenario setup.
      - name: raw_exchange_rates
      - name: orders
        description: Shared sandbox order source used by Lighthouse scenario-pack tests.
        columns:
          - name: scenario_id
          - name: record_source
          - name: ingest_batch_id
          - name: order_id
          - name: customer_id
          - name: vin
          - name: market
          - name: order_status
          - name: order_amount
          - name: source_updated_at
          - name: loaded_at
      - name: vehicle
        description: Shared sandbox vehicle source used by Lighthouse scenario-pack tests.
        columns:
          - name: scenario_id
          - name: record_source
          - name: ingest_batch_id
          - name: vin
          - name: vehicle_id
          - name: make
          - name: model
          - name: market
          - name: source_updated_at
          - name: loaded_at
